name: GH200 ARM64 source smoke
on:
  push:
    branches:
      - feat/gh200-arm64-inference
  pull_request:
    paths:
      - 'src/kernels/cpu/**'
      - 'include/strata/**'
      - 'setup.py'
      - 'gh200/**'
      - '.github/workflows/gh200-arm64.yml'
jobs:
  arm64-source:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Standalone ARM64 translation-unit compile
        run: |
          uname -m
          c++ --version
          c++ -std=c++17 -O2 -Wall -Wextra -Iinclude -c src/kernels/cpu/portable.cpp -o /tmp/strata-portable.o
          c++ -std=c++17 -O2 -Wall -Wextra -Iinclude -c src/kernels/cpu/expert_layout.cpp -o /tmp/strata-layout.o
      - name: GH200 profile tests and installer syntax
        run: |
          python3 -m py_compile setup.py gh200/configure.py gh200/benchmark.py
          python3 -m unittest discover -s gh200 -p 'test_*.py' -v
  x86-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: x86 ISA dispatcher source smoke
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Iinclude -c src/kernels/cpu/expert_layout.cpp -o /tmp/strata-layout-x86.o
      - name: Profile generator tests
        run: |
          python3 -m unittest discover -s gh200 -p 'test_*.py' -v
